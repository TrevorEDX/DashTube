name: Build DashTube APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build DashTube APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew :app:assembleRelease --stacktrace 2>&1 | tee build.log
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/DashTube.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${{ github.run_number }}"
          gh release create "$tag" dist/DashTube.apk \
            --title "DashTube build ${{ github.run_number }}" \
            --notes "YouTube-only Android Auto app, based on AABrowser (GPL-3.0). Needs Android 15 or newer. Source is in this repository."

      # Public copy of the build log when a build fails, so it can be read without signing in.
      - name: Publish build log on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f build.log ] || echo "no build log" > build.log
          tag="build-log-${{ github.run_number }}"
          gh release create "$tag" build.log --prerelease \
            --title "Failed build log ${{ github.run_number }}" \
            --notes "Build failed; log attached."
